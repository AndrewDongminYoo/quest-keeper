name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Swift tests
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run unit tests
        run: |
          # -showdestinations already filters by IPHONEOS_DEPLOYMENT_TARGET, so a
          # destination it lists is one this scheme can actually build for. Printing
          # it keeps the runner's device set visible when an image rotation breaks
          # the match, which is how the pinned 'iPhone 17, OS=26.5' died.
          destinations=$(xcodebuild -showdestinations -scheme QuestKeeper 2>&1)
          printf '%s\n' "$destinations"

          simulator_id=$(printf '%s\n' "$destinations" \
            | grep 'platform:iOS Simulator' \
            | grep 'name:iPhone' \
            | sed -n 's/.*id:\([^,}]*\).*/\1/p' \
            | tr -d ' ' \
            | head -1)
          if [ -z "$simulator_id" ]; then
            echo "::error::No iPhone simulator destination available for the QuestKeeper scheme."
            exit 1
          fi
          echo "Testing on simulator $simulator_id"

          xcodebuild test -scheme QuestKeeper \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -only-testing:QuestKeeperTests \
            -parallel-testing-enabled NO
