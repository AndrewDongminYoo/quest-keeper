name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Swift tests
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check main release version
        run: bash scripts/test-main-release-version.sh

      - name: Run localization checks
        run: bash scripts/test-localization.sh

      - name: Run store screenshot contract checks
        run: bash scripts/test-store-screenshots.sh

      - name: Report the runner's simulator state
        run: |
          uname -m
          xcode-select --print-path
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Run tests
        run: |
          # -showdestinations already filters by IPHONEOS_DEPLOYMENT_TARGET, so a destination it
          # lists is one this scheme can actually build for. A pinned 'name=…,OS=…' cannot survive
          # a runner image that ships a different device set, which is how the previous pin died.
          destinations=$(xcodebuild -showdestinations -scheme QuestKeeper 2>&1)
          printf '%s\n' "$destinations"

          # -showdestinations also prints an "Ineligible destinations" section, whose entries the
          # scheme cannot build for. Read only the eligible half.
          simulator_id=$(printf '%s\n' "$destinations" \
            | awk '/Ineligible destinations/ { exit } /Available destinations/ { eligible = 1; next } eligible' \
            | grep 'platform:iOS Simulator' \
            | grep 'name:iPhone' \
            | sed -n 's/.*id:\([^,}]*\).*/\1/p' \
            | tr -d ' ' \
            | head -1)

          # Some runner images arrive with the iOS runtime installed but no devices created, so
          # -showdestinations reports only placeholders. Create one rather than failing the job.
          if [ -z "$simulator_id" ]; then
            echo "No pre-created iPhone simulator; creating one from the newest installed iOS runtime."
            runtime=$(xcrun simctl list runtimes --json \
              | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | contains("SimRuntime.iOS-")))]
                       | sort_by(.version | split(".") | map(tonumber))
                       | map(.identifier) | last // ""')
            if [ -n "$runtime" ]; then
              simulator_id=$(xcrun simctl create ci-iphone "iPhone 17" "$runtime") || simulator_id=""
            fi
          fi

          if [ -z "$simulator_id" ]; then
            echo "::error::No iPhone simulator destination is available and none could be created."
            exit 1
          fi
          echo "Testing on simulator $simulator_id"

          xcodebuild test -scheme QuestKeeper \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -only-testing:QuestKeeperTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/QuestKeeperTests.xcresult"

          # The UI target was already being built on every run and never executed, which is how
          # two stale expectations reached main unnoticed (#72). It reuses the build above, so the
          # added cost is the run itself.
          #
          # `-retry-tests-on-failure` re-runs a failing test, to a maximum of three attempts.
          # This suite has produced presentation timeouts under the load of a sequential
          # fifty-six-test run that pass on their own: `testDailyFocusExplicitConfirmationAndCompletion`
          # and `testEnablingStaysGatedUntilAFirstQuestExists`, each waiting three seconds for a
          # sheet. Without a retry the job fails on machine load rather than on the code. The
          # retries are named in the xcodebuild output, so a test that only ever passes on the
          # second attempt is still visible rather than silently green.
          ui_test_log="$RUNNER_TEMP/QuestKeeperUITests.log"
          set +e
          xcodebuild test -scheme QuestKeeper \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -only-testing:QuestKeeperUITests \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -resultBundlePath "$RUNNER_TEMP/QuestKeeperUITests.xcresult" \
            2>&1 | tee "$ui_test_log"
          ui_test_exit=${PIPESTATUS[0]}
          set -e

          retry_count=$(grep -Ec 'Test Case .* started \(Iteration [2-9][0-9]* of [0-9]+\)' "$ui_test_log" || true)
          {
            echo "### UI test retries"
            echo
            echo "- Retry events reported by xcodebuild: $retry_count"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$ui_test_exit"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/QuestKeeperTests.xcresult
            ${{ runner.temp }}/QuestKeeperUITests.xcresult
            ${{ runner.temp }}/QuestKeeperUITests.log
          if-no-files-found: warn
