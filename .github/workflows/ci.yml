name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Swift tests
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report the runner's simulator state
        run: |
          uname -m
          xcode-select --print-path
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Run unit tests
        run: |
          # -showdestinations already filters by IPHONEOS_DEPLOYMENT_TARGET, so a destination it
          # lists is one this scheme can actually build for. A pinned 'name=…,OS=…' cannot survive
          # a runner image that ships a different device set, which is how the previous pin died.
          destinations=$(xcodebuild -showdestinations -scheme QuestKeeper 2>&1)
          printf '%s\n' "$destinations"

          # -showdestinations also prints an "Ineligible destinations" section, whose entries the
          # scheme cannot build for. Read only the eligible half.
          simulator_id=$(printf '%s\n' "$destinations" \
            | awk '/Ineligible destinations/ { exit } /Available destinations/ { eligible = 1; next } eligible' \
            | grep 'platform:iOS Simulator' \
            | grep 'name:iPhone' \
            | sed -n 's/.*id:\([^,}]*\).*/\1/p' \
            | tr -d ' ' \
            | head -1)

          # Some runner images arrive with the iOS runtime installed but no devices created, so
          # -showdestinations reports only placeholders. Create one rather than failing the job.
          if [ -z "$simulator_id" ]; then
            echo "No pre-created iPhone simulator; creating one from the newest installed iOS runtime."
            runtime=$(xcrun simctl list runtimes --json \
              | jq -r '[.runtimes[] | select(.isAvailable and .platform == "iOS")]
                       | sort_by(.version | split(".") | map(tonumber))
                       | map(.identifier) | last // ""')
            if [ -n "$runtime" ]; then
              simulator_id=$(xcrun simctl create ci-iphone "iPhone 17" "$runtime") || simulator_id=""
            fi
          fi

          if [ -z "$simulator_id" ]; then
            echo "::error::No iPhone simulator destination is available and none could be created."
            exit 1
          fi
          echo "Testing on simulator $simulator_id"

          xcodebuild test -scheme QuestKeeper \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -only-testing:QuestKeeperTests \
            -parallel-testing-enabled NO
